<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Link Fixer icon variants</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      body {
        margin: 0 auto;
        max-width: 76rem;
        padding: 1.5rem;
        color: #202124;
        background: #fff;
        font-size: 0.875rem;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
      }

      p {
        margin: 0 0 1.25rem;
        color: #5f6368;
      }

      table {
        border-collapse: collapse;
      }

      th,
      td {
        padding: 0.375rem;
        text-align: left;
        vertical-align: top;
      }

      thead th {
        font-weight: 600;
        white-space: nowrap;
      }

      tbody th {
        font-weight: 400;
        white-space: nowrap;
      }

      .swatch {
        display: inline-block;
        width: 0.75rem;
        height: 0.75rem;
        margin-right: 0.375rem;
        border: 1px solid #dadce0;
        border-radius: 2px;
        vertical-align: -1px;
      }

      .cell {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .strip {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: 7.5rem;
        min-height: 3.25rem;
        padding: 0.5rem 0.75rem;
        border-radius: 0.25rem;
      }

      .strip.light {
        background: #ffffff;
        box-shadow: inset 0 0 0 1px #dadce0;
      }

      .strip.dark {
        background: #202124;
      }

      .strip svg {
        display: block;
        flex: none;
      }

      .current th,
      .current td {
        background: #f1f3f4;
      }

      .note {
        margin-top: 1.25rem;
        color: #5f6368;
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <h1>Link Fixer icon variants</h1>
    <p>
      16 / 32 / 48px。上段がライト（#ffffff）、下段がダーク（#202124）。
      現在は #6b6b6b・線幅 9 です。
    </p>

    <table id="grid">
      <thead>
        <tr>
          <th></th>
          <th>線幅 9（現在）</th>
          <th>線幅 11</th>
          <th>線幅 13</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p class="note">
      実際の配布物は PNG ですが、ここでは同じ SVG をブラウザで縮小表示しています。
      色と線の太さの比較用です。
    </p>

    <script>
      const colors = ['#6b6b6b', '#757575', '#7a7a7a', '#808080', '#8a8a8a'];
      const strokes = [9, 11, 13];
      const sizes = [16, 32, 48];
      let maskId = 0;

      function icon(color, strokeWidth, size) {
        const id = `front-gap-${maskId++}`;
        return `<svg width="${size}" height="${size}" viewBox="0 0 128 128" fill="none" aria-hidden="true">
          <defs>
            <mask id="${id}">
              <rect width="128" height="128" fill="#fff" />
              <rect x="36" y="22" width="64" height="64" rx="10" fill="none" stroke="#000" stroke-width="21" />
            </mask>
          </defs>
          <g transform="translate(64 64) scale(1.4) translate(-60.5 -61.5)">
            <rect x="21" y="37" width="64" height="64" rx="10" fill="none" stroke="${color}"
                  stroke-width="${strokeWidth}" mask="url(#${id})" />
            <rect x="36" y="22" width="64" height="64" rx="10" fill="none" stroke="${color}"
                  stroke-width="${strokeWidth}" />
          </g>
        </svg>`;
      }

      function strip(className, color, strokeWidth) {
        return `<div class="strip ${className}">
          ${sizes.map((size) => icon(color, strokeWidth, size)).join('')}
        </div>`;
      }

      const tbody = document.querySelector('#grid tbody');

      for (const color of colors) {
        const row = document.createElement('tr');
        if (color === '#6b6b6b') {
          row.className = 'current';
        }
        row.innerHTML = `<th scope="row">
          <span class="swatch" style="background:${color}"></span>${color}
        </th>` + strokes
          .map(
            (strokeWidth) => `<td><div class="cell">
              ${strip('light', color, strokeWidth)}
              ${strip('dark', color, strokeWidth)}
            </div></td>`,
          )
          .join('');
        tbody.append(row);
      }
    </script>
  </body>
</html>
