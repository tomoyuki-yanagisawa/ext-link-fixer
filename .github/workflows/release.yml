name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION は公開済みのためスキップします。"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION を公開します。"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists == 'false'
        run: npm run typecheck

      - if: steps.check.outputs.exists == 'false'
        run: |
          npm run zip
          npm run zip:firefox

      - name: Sign Firefox build (unlisted)
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER / AMO_JWT_SECRET が未設定です。"
            exit 1
          fi

          npx web-ext sign \
            --channel=unlisted \
            --source-dir=.output/firefox-mv3 \
            --artifacts-dir=.output/signed \
            --upload-source-code=".output/link-fixer-$VERSION-sources.zip" \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET"

          # 署名済みの .xpi をリリース用の名前に揃える
          cp .output/signed/*.xpi ".output/link-fixer-$VERSION-firefox.xpi"

      - if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$VERSION" \
            ".output/link-fixer-$VERSION-chrome.zip" \
            ".output/link-fixer-$VERSION-firefox.zip" \
            ".output/link-fixer-$VERSION-firefox.xpi" \
            --title "v$VERSION" \
            --generate-notes
