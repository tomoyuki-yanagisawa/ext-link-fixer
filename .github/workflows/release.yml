name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION は公開済みのためスキップします。"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION を公開します。"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists == 'false'
        run: npm run typecheck

      - if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          npm run zip
          npm run zip:firefox
          # Developer Edition などで読み込みやすいよう、同じ内容を .xpi としても用意する
          cp ".output/link-fixer-$VERSION-firefox.zip" ".output/link-fixer-$VERSION-firefox.xpi"

      - if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          prev_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            git log --no-merges --pretty='- %s' "$prev_tag..HEAD" > release-notes.md
          else
            git log --no-merges --pretty='- %s' > release-notes.md
          fi

          gh release create "v$VERSION" \
            ".output/link-fixer-$VERSION-chrome.zip" \
            ".output/link-fixer-$VERSION-firefox.zip" \
            ".output/link-fixer-$VERSION-firefox.xpi" \
            --title "v$VERSION" \
            --notes-file release-notes.md
