<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Link Fixer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Link Fixer</h1>
      <p class="hint">
        URL を書き換えるルールを登録できます。上から順に評価され、最初にマッチしたルールが適用されます。
      </p>

      <hr />

      <fieldset>
        <legend>サイトアクセス</legend>
        <p id="permission-status">サイトアクセスの状態を確認しています…</p>
        <button type="button" id="permission-request" disabled>
          サイトアクセスを許可
        </button>
      </fieldset>

      <hr />

      <form id="form">
        <fieldset>
          <legend>ルール</legend>

          <p class="hint">
            左の正規表現にマッチした URL を、右の URL に置き換えます。正規表現は DNR が受け付ける形式で指定してください。
          </p>

          <div id="rows"></div>

          <div class="actions">
            <button type="button" id="add">ルールを追加</button>
          </div>
        </fieldset>

        <div class="actions">
          <p id="status" role="status" aria-live="polite"></p>
          <button type="submit" id="save">保存</button>
        </div>
      </form>

      <hr />

      <fieldset>
        <legend>Playground</legend>
        <p class="hint">
          保存済みのルールで URL がどう書き換わるかを試せます。DNR の条件（大文字小文字を区別しない、fragment は除外）に合わせて判定します。
        </p>

        <div class="playground-controls">
          <input
            type="text"
            id="playground-url"
            spellcheck="false"
            autocomplete="off"
            placeholder="https://example.com/old/123"
            aria-label="試す URL"
          />
          <button type="button" id="playground-run">実行</button>
        </div>

        <div id="playground-result" role="status" aria-live="polite"></div>
      </fieldset>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
