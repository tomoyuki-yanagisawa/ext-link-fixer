<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Link Fixer</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="/icons/16.png" sizes="16x16" />
    <link rel="icon" href="/icons/32.png" sizes="32x32" />
  </head>
  <body>
    <header>
      <h1>Link Fixer</h1>
      <p class="hint">{{options_lead}}</p>
    </header>

    <main>
      <fieldset>
        <legend>{{options_siteAccess_legend}}</legend>
        <p id="permission-status" class="status">
          {{options_siteAccess_checking}}
        </p>
        <button type="button" id="permission-request" disabled>
          {{options_siteAccess_request}}
        </button>
      </fieldset>

      <form id="form">
        <fieldset>
          <legend>{{options_rules_legend}}</legend>

          <p class="hint">{{options_rules_hint}}</p>

          <div id="rows"></div>

          <template id="rule-template">
            <div class="rule-row">
              <input
                type="text"
                class="regex"
                aria-label="{{options_rules_regexLabel}}"
                spellcheck="false"
                autocomplete="off"
                placeholder="^https://example\.com/search\?q=(.*)$"
              />
              <input
                type="text"
                class="substitution"
                aria-label="{{options_rules_substitutionLabel}}"
                spellcheck="false"
                autocomplete="off"
                placeholder="https://example.com/find?query=\1"
              />
              <button type="button" class="remove">
                {{options_rules_remove}}
              </button>
            </div>
          </template>

          <div class="actions">
            <button type="button" id="add">{{options_rules_add}}</button>
          </div>
        </fieldset>

        <div class="actions">
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <button type="submit" id="save">{{options_rules_save}}</button>
        </div>
      </form>

      <fieldset>
        <legend>{{options_playground_legend}}</legend>
        <p class="hint">{{options_playground_hint}}</p>

        <div class="playground-controls">
          <input
            type="text"
            id="playground-url"
            spellcheck="false"
            autocomplete="off"
            placeholder="https://example.com/old/123"
            aria-label="{{options_playground_urlLabel}}"
          />
          <button type="button" id="playground-run">
            {{options_playground_run}}
          </button>
        </div>

        <textarea
          id="playground-result"
          rows="6"
          readonly
          aria-label="{{options_playground_resultLabel}}"
        ></textarea>
      </fieldset>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
